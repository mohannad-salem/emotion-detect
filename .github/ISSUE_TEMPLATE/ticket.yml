name: Ticket
description: One small, buildable piece of a feature (created by the manager)
labels: ["ticket"]
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone branch
      placeholder: milestone/user-login
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What to build
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Numbered and testable. Each one needs a test.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: areas
    attributes:
      label: Files or areas touched
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#12, or none"
